name: Update Publications

on:
  schedule:
    # Weekly on Monday at 8:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling through the API on every run resets that clock.
      - name: Keep schedule alive
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-publications.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so the staleness check below can date the data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape Google Scholar
        id: scrape
        continue-on-error: true
        run: python scripts/scrape_scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      # Scholar blocks GitHub's servers, so the real refresh is done by a weekly
      # scheduled task on the owner's PC (scripts/update_local.ps1). This job is
      # the backstop: three weeks without fresh data fails the run so it gets noticed.
      - name: Flag stale data
        if: steps.scrape.outcome != 'success'
        run: |
          last=$(git log -1 --format=%ct -- data/scholar_meta.json data/publications.json)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Scholar data last refreshed $age days ago"
          if [ "$age" -gt 21 ]; then
            echo "::error::Google Scholar has been unreachable for $age days; the site's citation count and paper list are stale. The weekly task on the PC (scripts/update_local.ps1) has not pushed; check its log in %LOCALAPPDATA%\\scholar-site-update, or run the script by hand."
            exit 1
          fi

      - name: Generate HTML
        if: steps.scrape.outcome == 'success'
        run: python scripts/generate_html.py

      - name: Validate index.html
        if: steps.scrape.outcome == 'success'
        run: |
          python -c "
          html = open('index.html').read()
          assert '<!-- AUTO-GENERATED-PUBS-START -->' in html, 'Start marker missing'
          assert '<!-- AUTO-GENERATED-PUBS-END -->' in html, 'End marker missing'
          assert '</html>' in html, 'Closing html tag missing'
          print('Validation passed')
          "

      - name: Commit and push changes
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json index.html
          [ -f data/scholar_meta.json ] && git add data/scholar_meta.json || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update publications from Google Scholar"
          git push
